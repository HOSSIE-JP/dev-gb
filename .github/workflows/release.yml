name: Windows portable release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'editor/**'
      - 'scripts/**'
      - 'config/**'
      - 'engine/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .downloads
            .cache/npm
          key: release-windows-${{ hashFiles('config/tools.lock.json', 'editor/package-lock.json') }}
      - name: Bootstrap build environment
        shell: cmd
        run: bootstrap.cmd -SkipExtensions -SkipDoctor
      - name: Typecheck and test
        shell: cmd
        run: .tools\node\npm.cmd --prefix editor run check
      - name: Package portable application
        shell: cmd
        run: |
          .tools\node\node.exe editor\build.mjs --production
          if errorlevel 1 exit /b %errorlevel%
          .tools\node\node.exe editor\build\compiler.cjs "%CD%" nova-spear Release
          if errorlevel 1 exit /b %errorlevel%
          .tools\node\node.exe editor\scripts\package-windows.mjs
          if errorlevel 1 exit /b %errorlevel%
      - name: Verify packaged application launch
        shell: powershell
        run: |
          $app = Resolve-Path '.cache/release/Caravan-Editor/Caravan-Editor.exe'
          $env:CARAVAN_PACKAGE_SMOKE = '1'
          $p = Start-Process -FilePath $app -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged startup failed: $($p.ExitCode)" }
          if (-not (Test-Path '.cache/release/Caravan-Editor/.cache/package-smoke.json')) { throw 'No startup evidence' }
      - name: Verify first setup and ROM build from the distributed files
        shell: powershell
        run: |
          $testRoot = Join-Path $pwd '.cache/release/verification'
          Copy-Item '.cache/release/Caravan-Editor' $testRoot -Recurse
          Copy-Item '.downloads' (Join-Path $testRoot '.downloads') -Recurse
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$testRoot/scripts/bootstrap.ps1" -Packaged -SkipDoctor -SkipExtensions -Offline
          if ($LASTEXITCODE -ne 0) { throw 'Packaged first setup failed' }
          if (Test-Path "$testRoot/editor/node_modules") { throw 'Unexpected source-build dependency' }
          & "$testRoot/.tools/node/node.exe" "$testRoot/resources/app/build/compiler.cjs" $testRoot star-caravan Release
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ROM build failed' }
      - name: Archive and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item '.cache/release/Caravan-Editor/.cache' -Recurse -Force
          $tag = 'editor-v1.1.1-' + $env:GITHUB_RUN_NUMBER
          $zip = '.cache/release/Caravan-Editor-win-x64.zip'
          Compress-Archive -Path '.cache/release/Caravan-Editor' -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Caravan-Editor-win-x64.zip' | Set-Content '.cache/release/SHA256SUMS.txt'
          ((Get-FileHash 'projects/nova-spear/build/Release/nova-spear.gb' -Algorithm SHA256).Hash.ToLowerInvariant() + '  nova-spear.gb') | Add-Content '.cache/release/SHA256SUMS.txt'
          @'
          Caravan Editor 1.1.1: readable 8x8 numeric font, resizable side columns, inspector overflow fixes, and a dedicated application icon. Includes a rebuilt NOVA SPEAR ROM.

          Windows x64 portable application. Download Caravan-Editor-win-x64.zip, extract the complete folder, and run Caravan-Editor.exe. First launch installs GBDK, Node.js, the font and the emulator locally. Git and Python are not required. Internet access and Windows PowerShell 5.1 are needed for setup. No administrator installation is required. This build is unsigned.

          Original code, documentation, skills and samples: MIT. External dependencies retain their own licenses; see the included notices. Downloaded emulator binaries are not bundled in this ZIP. HTML export displays a redistribution notice before first use; this does not grant rights or remove legal responsibilities.
          '@ | Set-Content '.cache/release/notes.md'
          gh release create $tag $zip '.cache/release/SHA256SUMS.txt' 'projects/nova-spear/build/Release/nova-spear.gb' --target $env:GITHUB_SHA --title "Caravan Editor $tag" --notes-file '.cache/release/notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
