name: Caravan Editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caravan-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore locked download caches
        uses: actions/cache@v4
        with:
          path: |
            .downloads
            .cache/npm
          key: portable-windows-${{ hashFiles('config/tools.lock.json', 'editor/package-lock.json') }}
      - name: Bootstrap the locked portable environment
        shell: cmd
        run: bootstrap.cmd -SkipExtensions -SkipDoctor
      - name: Validate tools
        shell: cmd
        run: doctor.cmd
      - name: Build and test all projects and editor workflows
        shell: cmd
        run: test.cmd
      - name: Build both shipping editor projects in Release
        shell: cmd
        run: |
          call build.cmd star-caravan -Configuration Release
          if errorlevel 1 exit /b %errorlevel%
          call build.cmd caravan-lab -Configuration Release
          if errorlevel 1 exit /b %errorlevel%
      - name: Bundle production editor
        shell: cmd
        run: .tools\node\node.exe editor\build.mjs --production
      - name: Retain build and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caravan-editor-verification
          path: |
            .cache/editor-qa/
            projects/*/build/Debug/caravan-build.json
            projects/*/build/Release/caravan-build.json
          if-no-files-found: ignore
