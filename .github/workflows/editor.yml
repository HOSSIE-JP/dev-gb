name: Caravan Editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caravan-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate setup selection and script syntax
        shell: powershell
        run: ./tests/setup-policy.test.ps1
      - name: Restore locked download caches
        uses: actions/cache@v4
        with:
          path: |
            .downloads
            .cache/npm
          key: portable-windows-${{ hashFiles('config/tools.lock.json', 'editor/package-lock.json') }}
      - name: Bootstrap the locked portable environment
        shell: cmd
        run: bootstrap.cmd -OptionalTools bgb -SkipExtensions -SkipDoctor
      - name: Validate tools
        shell: cmd
        run: doctor.cmd
      - name: Build and test all projects and editor workflows
        shell: cmd
        run: test.cmd
      - name: Build shipping editor projects in Release
        shell: cmd
        run: |
          call build.cmd star-caravan -Configuration Release
          if errorlevel 1 exit /b %errorlevel%
          call build.cmd caravan-lab -Configuration Release
          if errorlevel 1 exit /b %errorlevel%
          call build.cmd nova-spear -Configuration Release
          if errorlevel 1 exit /b %errorlevel%
      - name: Bundle production editor
        shell: cmd
        run: .tools\node\node.exe editor\build.mjs --production
      - name: Verify dense bullets, animation and all boss phases in DMG and CGB
        shell: powershell
        run: |
          foreach ($case in @('stress', 'animation', 'enemies', 'boss-0', 'boss-1', 'boss-2')) {
            & .tools\node\node.exe editor\tests\stg-benchmark.mjs . .cache/stg-performance $case --expect32 --check-budget
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify SM83 kernels against independent C arithmetic
        shell: cmd
        run: .tools\node\node.exe editor\tests\kernel-runtime.mjs .cache/kernel-qa
      - name: Retain build and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caravan-editor-verification
          path: |
            .cache/editor-qa/
            .cache/nova-spear-qa/
            .cache/stg-performance/*.json
            .cache/kernel-qa/results.json
            projects/*/build/Debug/caravan-build.json
            projects/*/build/Release/caravan-build.json
          if-no-files-found: ignore
      - name: Retain playable NOVA SPEAR ROM
        uses: actions/upload-artifact@v4
        with:
          name: nova-spear-game-boy
          path: |
            projects/nova-spear/build/Release/nova-spear.gb
            projects/nova-spear/README.md
            projects/nova-spear/assets-src/art/README.md
            engine/caravan/MUSIC-LICENSE.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            docs/licensing.md
          if-no-files-found: error
